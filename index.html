<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自己紹介｜山口祐果</title>
  <style>
    :root {
      --bg: #d7eefb;
      --sheet: #f7fcff;
      --ink: #2c5578;
      --muted: #5d86a8;
      --job: #ff7b9c;
      --tour: #3ec6b0;
      --karaoke: #ff6fa3;
      --movie: #5aa6f2;
      --card: #ffffff;
      --gothic: "Yu Gothic UI", "Yu Gothic", "Hiragino Sans", Meiryo, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 12px 28px;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 8% 12%, rgba(255, 255, 255, 0.95) 0 16px, transparent 17px),
        radial-gradient(circle at 94% 8%, rgba(255, 183, 208, 0.7) 0 22px, transparent 23px),
        radial-gradient(circle at 96% 72%, rgba(255, 255, 255, 0.8) 0 12px, transparent 13px),
        radial-gradient(circle at 4% 88%, rgba(186, 224, 255, 0.95) 0 26px, transparent 27px),
        linear-gradient(180deg, #eaf7ff 0%, #cfe8f8 100%);
      color: var(--ink);
      font-family: var(--gothic);
      font-size: 16px;
      line-height: 1.65;
    }

    .sheet {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 36px 40px 32px;
      background: rgba(247, 252, 255, 0.92);
      border: 3px solid #fff;
      border-radius: 36px;
      box-shadow: 0 18px 40px rgba(110, 176, 220, 0.22);
    }

    .mast {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 8px;
    }

    .kicker {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.1;
      color: #2f74aa;
    }

    h1::after {
      content: " ✦";
      color: #ff8fb3;
      font-size: 0.55em;
      letter-spacing: 0;
    }

    .lead {
      margin: 14px 0 26px;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .map {
      position: relative;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(190px, 230px) 76px minmax(0, 1fr);
      grid-template-areas:
        "hub joblabel job"
        "hub tourlabel tour"
        "hub karaokelabel karaoke"
        "hub movielabel movie"
        ". . overlap";
      gap: 14px 16px;
      align-items: stretch;
      padding-right: 34px;
    }

    .strings {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 0;
    }

    .hub,
    .card {
      position: relative;
      z-index: 1;
      border: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .hub {
      grid-area: hub;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 320px;
      padding: 26px 18px 22px;
      border-radius: 32px;
      border: 3px solid #fff;
      background: #fff;
      color: #2f74aa;
      text-align: center;
      box-shadow: 0 10px 0 #c5e6fa;
    }

    .hub.is-on {
      box-shadow: 0 0 0 4px #fff, 0 0 0 8px #ff9ebb;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #ffe4ee;
      color: #e25b86;
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    .tally {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff7b9c;
      box-shadow: none;
    }

    .name {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.12em;
    }

    .hello {
      color: #6a9bc4;
      font-size: 13px;
      letter-spacing: 0.08em;
      line-height: 1.7;
    }

    .rail {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      position: relative;
      z-index: 2;
    }

    .rail-job { grid-area: joblabel; }
    .rail-tour { grid-area: tourlabel; }
    .rail-karaoke { grid-area: karaokelabel; }
    .rail-movie { grid-area: movielabel; }

    .rail span {
      background: #fff;
      color: #3d84b8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      border-radius: 999px;
      box-shadow: 0 3px 0 #d7eefb;
      padding: 6px 10px;
    }

    .card {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      column-gap: 12px;
      row-gap: 2px;
      align-items: center;
      min-height: 78px;
      padding: 12px 16px;
      border-radius: 22px;
      background: var(--card);
      border: 2px solid #fff;
      text-align: left;
      box-shadow: 0 7px 0 #d9eefb;
    }

    .card:hover,
    .hub:hover { filter: brightness(1.03); }

    .card:focus-visible,
    .hub:focus-visible {
      outline: 2px solid var(--accent, var(--job));
      outline-offset: 3px;
    }

    .card.is-on {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .job { grid-area: job; --accent: var(--job); }
    .tour { grid-area: tour; --accent: var(--tour); }
    .karaoke { grid-area: karaoke; --accent: var(--karaoke); }
    .movie { grid-area: movie; --accent: var(--movie); }

    .icon {
      grid-row: 1 / span 2;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, white);
    }

    .icon svg { display: block; }

    .meta {
      grid-column: 2;
      grid-row: 1;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    .card strong {
      grid-column: 2;
      grid-row: 2;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.3;
    }

    .badge {
      grid-column: 3;
      grid-row: 1 / span 2;
      align-self: center;
      justify-self: end;
      padding: 2px 7px;
      border-radius: 999px;
      color: #c43d68;
      background: #ffe4ee;
      font-size: 11px;
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .movie .badge {
      color: #2d74c4;
      background: #e3f2ff;
    }

    .overlap {
      grid-area: overlap;
      min-width: 0;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.03em;
      line-height: 1.7;
    }

    .overlap.is-on {
      color: var(--ink);
      font-weight: 700;
    }

    .swatch {
      display: inline-block;
      width: 28px;
      margin-right: 8px;
      vertical-align: middle;
      border-top: 2px dashed #ff8fb3;
    }

    .script {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px 36px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 2px dashed #c5e4f6;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #3d84b8;
    }

    ol {
      list-style: none;
      margin: 0;
      padding: 0;
      counter-reset: line;
    }

    .line {
      counter-increment: line;
      display: flex;
      gap: 10px;
      margin: 0 0 6px;
      padding: 10px 12px;
      border-radius: 18px;
      line-height: 1.75;
    }

    .line::before {
      content: counter(line);
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      margin-top: 2px;
      border-radius: 50%;
      background: #e5f4ff;
      color: #3d84b8;
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .line.is-on {
      background: var(--card);
      box-shadow: inset 3px 0 0 var(--hot, var(--ink));
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      .tally { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse {
        50% { opacity: 0.4; }
      }
    }

    @media (max-width: 760px) {
      .sheet {
        padding: 22px 16px 18px;
        border-radius: 18px;
      }

      h1 { font-size: 32px; letter-spacing: 0.12em; }

      .mast { align-items: flex-start; }

      .map {
        grid-template-columns: 1fr;
        grid-template-areas:
          "hub"
          "joblabel"
          "job"
          "tourlabel"
          "tour"
          "karaokelabel"
          "karaoke"
          "movielabel"
          "movie"
          "overlap";
        padding-right: 0;
        gap: 10px;
      }

      .strings { display: none; }

      .hub { min-height: 0; padding: 22px 16px; }

      .name { font-size: 40px; }

      .rail { justify-content: flex-start; }

      .card { border-left: 4px solid var(--accent); }

      .script { grid-template-columns: 1fr; gap: 18px; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header class="mast">
      <div>
        <p class="kicker">講義を一緒に受けるメンバーへ</p>
        <h1>自己紹介</h1>
      </div>
    </header>
    <p class="lead">名前、仕事、趣味の関係です。項目を選ぶと、下の本文で対応する行が強調されます。</p>

    <section class="map" id="map" aria-label="山口祐果の関係図">
      <svg class="strings" id="strings" aria-hidden="true"></svg>

      <button class="hub" type="button" data-node="hub" aria-pressed="false">
        <span class="eyebrow"><span class="tally" aria-hidden="true"></span>名前</span>
        <span class="name">山口<br>祐果</span>
        <span class="hello">講義を一緒に受ける<br>メンバーへ</span>
      </button>

      <p class="rail rail-job"><span>仕事</span></p>
      <p class="rail rail-tour"><span>趣味</span></p>
      <p class="rail rail-karaoke"><span>趣味</span></p>
      <p class="rail rail-movie"><span>趣味</span></p>

      <button class="card job" type="button" data-node="job" aria-pressed="false">
        <span class="icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M4 9h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9z"/>
            <path d="M4 9l2.4-4h2.2L6.4 9M9.2 9l2.4-4h2.2L11.6 9M14.6 9l2.4-4H20L17.2 9"/>
          </svg>
        </span>
        <span class="meta">仕事</span>
        <strong>動画制作</strong>
        <em class="badge">動画</em>
      </button>

      <button class="card tour" type="button" data-node="tour" aria-pressed="false">
        <span class="icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="17" r="2"/>
            <circle cx="18" cy="7" r="2"/>
            <path d="M8 16.2c2.2-1.4 3.4-3.4 5.2-5.4 1.6-1.8 3-3 6.2-3.6"/>
          </svg>
        </span>
        <span class="meta">趣味</span>
        <strong>ツーリング</strong>
      </button>

      <button class="card karaoke" type="button" data-node="karaoke" aria-pressed="false">
        <span class="icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="10" rx="3"/>
            <path d="M7 11a5 5 0 0 0 10 0M12 16v3.5M9 20.5h6"/>
          </svg>
        </span>
        <span class="meta">趣味</span>
        <strong>カラオケ</strong>
      </button>

      <button class="card movie" type="button" data-node="movie" aria-pressed="false">
        <span class="icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M10 9.2l5.2 2.8L10 14.8V9.2z" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="meta">趣味</span>
        <strong>動画作り</strong>
        <em class="badge">動画</em>
      </button>

      <p class="overlap" id="overlap">
        <span class="swatch" aria-hidden="true"></span>
        仕事の動画制作と、趣味の動画作りは、動画でつながっています。
      </p>
    </section>

    <section class="script" aria-label="自己紹介の本文">
      <div>
        <h2>名前</h2>
        <ol>
          <li class="line" data-lines="hub">はじめまして。山口祐果です。</li>
          <li class="line" data-lines="job">仕事は、動画制作をしています。</li>
          <li class="line" data-lines="hub">どうぞよろしくお願いします。</li>
        </ol>
      </div>
      <div>
        <h2>趣味</h2>
        <ol>
          <li class="line" data-lines="tour karaoke">趣味は、ツーリングとカラオケです。</li>
          <li class="line" data-lines="movie">動画を作ることも好きです。</li>
          <li class="line" data-lines="tour karaoke movie">同じ趣味の人がいたら、気軽に声をかけてください。</li>
        </ol>
      </div>
    </section>
    <p class="visually-hidden" id="status" aria-live="polite"></p>
  </main>

  <script>
    const map = document.getElementById("map");
    const svg = document.getElementById("strings");
    const status = document.getElementById("status");
    const overlap = document.getElementById("overlap");
    const narrowQuery = window.matchMedia("(max-width: 760px)");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const rootStyle = getComputedStyle(document.documentElement);
    const colors = {
      hub: rootStyle.getPropertyValue("--ink").trim(),
      job: rootStyle.getPropertyValue("--job").trim(),
      tour: rootStyle.getPropertyValue("--tour").trim(),
      karaoke: rootStyle.getPropertyValue("--karaoke").trim(),
      movie: rootStyle.getPropertyValue("--movie").trim()
    };
    const captions = {
      hub: "はじめまして。山口祐果です。どうぞよろしくお願いします。",
      job: "仕事は、動画制作をしています。",
      tour: "趣味は、ツーリングとカラオケです。",
      karaoke: "趣味は、ツーリングとカラオケです。",
      movie: "動画を作ることも好きです。"
    };

    let active = null;
    let introduced = false;

    function rel(el) {
      const m = map.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      return {
        left: r.left - m.left,
        right: r.right - m.left,
        cy: r.top - m.top + r.height / 2
      };
    }

    function isHot(from, to) {
      if (!active) return false;
      if (active === "hub") return from === "hub" || to === "hub";
      return from === active || to === active;
    }

    function addPath(d, color, hot, dashed) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", dashed || hot ? color : "#8ec4ef");
      path.setAttribute("stroke-width", dashed ? (hot ? "2.6" : "1.8") : (hot ? "2.4" : "1.35"));
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      path.setAttribute("opacity", dashed ? (hot ? "1" : "0.9") : (hot ? "1" : "0.32"));
      if (dashed) path.setAttribute("stroke-dasharray", "5 6");
      svg.appendChild(path);

      if (!dashed && !introduced && !reduceMotion) {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
        requestAnimationFrame(() => {
          path.style.transition = "stroke-dashoffset 700ms ease";
          path.style.strokeDashoffset = "0";
        });
      }
    }

    function draw() {
      svg.replaceChildren();
      if (narrowQuery.matches || map.clientWidth < 80) return;

      const width = map.clientWidth;
      const height = map.clientHeight;
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);

      const nodes = {};
      map.querySelectorAll("[data-node]").forEach((el) => {
        nodes[el.dataset.node] = rel(el);
      });

      ["job", "tour", "karaoke", "movie"].forEach((id) => {
        const from = nodes.hub;
        const to = nodes[id];
        if (!from || !to) return;
        const x1 = from.right + 1;
        const x2 = to.left - 1;
        if (x2 <= x1) return;
        addPath(
          "M " + x1 + " " + to.cy + " H " + x2,
          colors[id],
          isHot("hub", id),
          false
        );
      });

      const job = nodes.job;
      const movie = nodes.movie;
      if (job && movie) {
        const gutter = Math.min(width - 8, Math.max(job.right, movie.right) + 18);
        const y1 = job.cy;
        const y2 = movie.cy;
        const radius = Math.min(12, Math.abs(y2 - y1) / 2);
        const d = [
          "M " + job.right + " " + y1,
          "H " + (gutter - radius),
          "Q " + gutter + " " + y1 + " " + gutter + " " + (y1 + radius),
          "V " + (y2 - radius),
          "Q " + gutter + " " + y2 + " " + (gutter - radius) + " " + y2,
          "H " + movie.right
        ].join(" ");
        addPath(d, colors.job, isHot("job", "movie"), true);
      }

      introduced = true;
    }

    function paint() {
      map.querySelectorAll("[data-node]").forEach((el) => {
        const on = el.dataset.node === active;
        el.classList.toggle("is-on", on);
        el.setAttribute("aria-pressed", on ? "true" : "false");
      });

      document.querySelectorAll(".line").forEach((el) => {
        const ids = el.dataset.lines.split(/\s+/);
        const on = Boolean(active) && ids.includes(active);
        el.classList.toggle("is-on", on);
        if (on) el.style.setProperty("--hot", colors[active]);
      });

      overlap.classList.toggle("is-on", active === "job" || active === "movie");
      status.textContent = active ? captions[active] : "";
      draw();
    }

    map.addEventListener("click", (event) => {
      const button = event.target.closest("[data-node]");
      if (!button || !map.contains(button)) return;
      const id = button.dataset.node;
      active = active === id ? null : id;
      paint();
    });

    let frame = 0;
    const observer = new ResizeObserver(() => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(draw);
    });
    observer.observe(map);
    paint();
  </script>
</body>
</html>
